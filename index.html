<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>À toi, mon amour</title>
  <style>
    body {
      background-color: #ffe6eb;
      font-family: Arial, sans-serif;
      color: #d63384;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: #ffffff;
      max-width: 450px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #e6005c;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .photo {
      width: 100%;
      max-width: 280px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      margin: 15px 0;
    }
    p {
      color: #4a4a4a;
      font-size: 16px;
      line-height: 1.6;
      margin: 20px 0;
    }
    .hearts {
      font-size: 24px;
      letter-spacing: 5px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- TITRE DE LA PAGE -->
    <h1>❤️ À toi, mon amour ❤️</h1>

    <!-- ADRESSE DE LA PHOTO (remplacez l'URL entre les guillemets) -->
    <img class="photo" src="Mettre_Lien_De_La_Photo_Ici.jpg" alt="Notre Photo">

    <!-- VOTRE MESSAGE PERSONNALISÉ -->
    <p>
      Ecrivez votre message d'amour ici. Vous pouvez ajouter autant de lignes que vous souhaitez pour lui exprimer ce que vous ressentez.
    </p>

    <!-- ÉMOJIS / CŒURS ANIMÉS -->
    <div class="hearts">💖 💕 💗 💕 💖</div>
  </div>

</body>
</html>
